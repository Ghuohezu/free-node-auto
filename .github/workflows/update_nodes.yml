name: Update Free Nodes

on:
  workflow_dispatch:
  schedule:
    # 每6小时运行一次
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: |
          python scripts/test_parser.py

      - name: Fetch Nodes
        run: |
          echo "开始抓取节点"
          python scripts/fetch_nodes.py

      - name: Clean Nodes
        run: |
          echo "开始清洗节点"
          python scripts/clean_nodes.py

      - name: Check Output
        run: |
          echo "===================="
          echo "最终节点数量"
          echo "===================="
          wc -l output/home_nodes.txt output/datacenter_nodes.txt
          echo ""
          echo "文件大小"
          ls -lh output/home_nodes.txt output/datacenter_nodes.txt
          echo ""
          echo "原生家宽示例"
          head -n 3 output/home_nodes.txt
          echo ""
          echo "原生机房示例"
          head -n 3 output/datacenter_nodes.txt
          echo ""
          # 两个清洗产物都为空直接判失败，避免把空订阅提交回仓库
          home=$(wc -l < output/home_nodes.txt)
          dc=$(wc -l < output/datacenter_nodes.txt)
          echo "校验节点数量: 家宽=$home 机房=$dc"
          test "$((home + dc))" -gt 0

      - name: Sync repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "自动更新节点"
          file_pattern: |
            output/*
            config/sources.txt
            config/Node file
          skip_checkout: true
          create_parent_directories: true
