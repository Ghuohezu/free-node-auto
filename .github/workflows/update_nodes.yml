name: Update Free Nodes


on:

  workflow_dispatch:

  schedule:

    - cron: "0 */6 * * *"



jobs:

  update:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


    - name: Checkout

      uses: actions/checkout@v4

      with:

        fetch-depth: 0



    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: Install

      run: |

        pip install requests pyyaml



    - name: Fetch Nodes

      run: |

        python scripts/fetch_nodes.py



    - name: Clean Nodes

      run: |

        python scripts/clean_nodes.py



    - name: Check Output

      run: |

        echo "======最终节点======"

        wc -l output/nodes.txt



    - name: Commit

      run: |

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git add output/nodes.txt


        git commit -m "自动更新节点" || echo "没有变化"


        git push origin main --force
