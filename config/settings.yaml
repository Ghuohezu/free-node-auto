# =========================================================
# 节点清洗配置
# 留空的字段会回退到脚本内置默认值（见 scripts/clean_nodes.py）
# =========================================================

# --- 纯净度切分 ---
# 纯净度 = 风险分数（0-100，越小越干净）。
# 低于或等于该值的节点才算"纯净"（绿色⚪/白色🟢图标），才会输出。
# 高于该值的节点会被反向删除（从 config/sources.txt 移除）。
purity_split: 30

# --- 风险判定 ---
# 风险分数超过该值判定为高风险（0-100，越大越脏）
# 与 purity_split 保持一致，避免同一节点在不同环节被不同标准对待
risk_threshold: 30

# 是否把判定为高风险的节点从输出中剔除
# true  = 剔除，明细写入 output/filtered_nodes.log
# false = 全部保留并打标签，同时把风险保留的节点写入 output/risky_nodes.txt
# 注意：只要存在未过滤的风险保留节点（例如 filter_vpn=false 时的 VPN 节点），
# 就会生成 output/risky_nodes.txt；没有则自动删除该文件。
filter_risky: true

# 是否过滤被标记为 VPN 的 IP
# 注意：ip-api.com 判定的 VPN IP 与高风险 IP 高度重合，
# 只要 filter_vpn=true，这些节点会被当作 VPN 直接剔除，
# 不会进入上面的风险保留分支（filter_risky 的 false 分支也就走不到）。
# 想让高风险节点进 output/risky_nodes.txt，需要同时把 filter_vpn 设为 false。
filter_vpn: true

# --- 反向删除 / sources.txt 维护 ---
# 是否在每次清洗后自动维护 config/sources.txt（自维护节点池）：
# - 删除：无法连接的节点、纯净度高于 purity_split 的节点、命中黑名单/风险的节点
# - 写回：纯净度 <= purity_split 的节点、可达但未知（无检测结果）的节点
# - 保留：订阅 URL / base64 来源（保证每次运行都能继续从上游拉新）、
#   注释、空行、无法解析的行（按未知处理）
reverse_delete_sources: true

# 被维护的源文件路径
sources_file: config/sources.txt

# 是否启用 IP 黑名单过滤
filter_blacklist: true

# IP 黑名单，命中直接剔除
blacklist_ips:
  - 120.227.1.43
  - 47.240.80.220

# --- 机房识别补充规则（可选）---
# ip-api 的 hosting 字段会把部分托管商误判成住宅，脚本内置了一批常见
# 云厂商/托管商 ASN 与关键词。发现新的误判商机后可以在这里追加。
# 示例：
# hosting_asns:
#   - AS12345
# hosting_keywords:
#   - "some-host-provider"
hosting_asns: []
hosting_keywords: []

# --- 检测数据源（会合并所有源的结果，不是"第一个成功就停"）---
# ipinfo: ipinfo.io，提供 asn.type / company.type / privacy.hosting，
#         能识别 ip-api 误判为住宅的机房 IP（推荐，免 key）
#         注意：公共接口约 1000 次/天且同出口 IP 共享，被限流时会自动
#         降级到 ipapi + 内置 ASN/关键词启发式判定
# ipapi : ip-api.com，补充风险分/代理标记/归属地
# ippure: api.ippure.net，提供风险分 + 共享人数（可选，接口不稳定）
# 机房判定规则：任意一源判定 hosting/机房即按机房处理；风险分取各源最大值。
sources:
  - ipinfo
  - ipapi

# --- 支持的节点协议 ---
protocols:
  - vmess://
  - vless://
  - ss://
  - ssr://
  - trojan://
  - anytls://
  - hysteria://
  - hysteria2://
  - hy2://
  - hy://
  - tuic://

# --- 并发与限速 ---
# 同时处理多少个节点
concurrency: 16

# 单个 HTTP 请求超时（秒）
request_timeout: 8

# 各数据源的请求速率上限（次/分钟），防止被限流
rate:
  ipinfo: 120
  ippure: 25
  ipapi: 40

# --- 可达性预过滤 ---
# 是否在清洗前探测节点可达性，剔除服务器端口不通的节点
# true  = 只输出活节点，死节点写入 output/dead_nodes.log
# false = 关闭探测，与 clash-ip-checker 一致（只做 IP 风险判定）
probe_reachability: true

# 单个节点探测超时（秒）
probe_timeout: 5

# 是否对 TLS 承载的节点（vless-tls / trojan / ss-tls）做 TLS 握手确认
# TLS 握手失败会判为不可达并剔除
probe_tls: true

user_agent: "Mozilla/5.0 (X11; Linux x86_64) node-cleaner/2.0"
