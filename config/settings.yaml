# =========================================================
# 节点清洗配置
# 留空的字段会回退到脚本内置默认值（见 scripts/clean_nodes.py）
# =========================================================

# --- 纯净度切分 ---
# 纯净度 = 风险分数（0-100，越小越干净）。
# 低于或等于该值的节点才算"纯净"（绿色⚪/白色🟢图标），才会输出。
# 高于该值的节点会被反向删除（从 config/sources.txt 移除）。
purity_split: 30

# --- 风险判定 ---
# 风险分数超过该值判定为高风险（0-100，越大越脏）
# 与 purity_split 保持一致，避免同一节点在不同环节被不同标准对待
risk_threshold: 30

# 是否把判定为高风险的节点从输出中剔除
# true  = 剔除，明细写入 output/filtered_nodes.log
# false = 全部保留并打标签，同时单独写入 output/risky_nodes.txt
# 注意：只有 filter_risky=false 时才会生成 output/risky_nodes.txt
filter_risky: true

# 是否过滤被标记为 VPN 的 IP
# 注意：ip-api.com 判定的 VPN IP 与高风险 IP 高度重合，
# 只要 filter_vpn=true，这些节点会被当作 VPN 直接剔除，
# 不会进入上面的风险保留分支（filter_risky 的 false 分支也就走不到）。
# 想让高风险节点进 output/risky_nodes.txt，需要同时把 filter_vpn 设为 false。
filter_vpn: true

# --- 反向删除 / sources.txt 维护 ---
# 是否在每次清洗后自动维护 config/sources.txt（自维护节点池）：
# - 删除：订阅 URL、base64 块（已抓取/解码完毕）、无法连接的节点、
#   纯净度高于 purity_split 的节点、命中黑名单/风险的节点
# - 写回：纯净度 <= purity_split 的节点、可达但未知（无检测结果）的节点
# - 保留：注释、空行、无法解析的行（按未知处理）
reverse_delete_sources: true

# 被维护的源文件路径
sources_file: config/sources.txt

# 是否启用 IP 黑名单过滤
filter_blacklist: true

# IP 黑名单，命中直接剔除
blacklist_ips:
  - 120.227.1.43
  - 47.240.80.220

# --- 检测数据源（按顺序尝试，前一个失败自动降级到下一个）---
# ippure : api.ippure.net，返回风险分 + 宽带类型 + IP 来源 + 共享人数
# ipapi  : ip-api.com，备用源，返回宽带类型（机房/住宅）
sources:
  - ippure
  - ipapi

# --- 支持的节点协议 ---
protocols:
  - vmess://
  - vless://
  - ss://
  - ssr://
  - trojan://
  - anytls://
  - hysteria://
  - hysteria2://
  - hy2://
  - hy://
  - tuic://

# --- 并发与限速 ---
# 同时处理多少个节点
concurrency: 16

# 单个 HTTP 请求超时（秒）
request_timeout: 8

# 各数据源的请求速率上限（次/分钟），防止被限流
rate:
  ippure: 25
  ipapi: 40

# --- 可达性预过滤 ---
# 是否在清洗前探测节点可达性，剔除服务器端口不通的节点
# true  = 只输出活节点，死节点写入 output/dead_nodes.log
# false = 关闭探测，与 clash-ip-checker 一致（只做 IP 风险判定）
probe_reachability: true

# 单个节点探测超时（秒）
probe_timeout: 5

# 是否对 TLS 承载的节点（vless-tls / trojan / ss-tls）做 TLS 握手确认
# TLS 握手失败会判为不可达并剔除
probe_tls: true

user_agent: "Mozilla/5.0 (X11; Linux x86_64) node-cleaner/2.0"
